org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Kotlin's incremental compiler crashes on Windows when the Gradle user
# home (pub cache, typically C:\Users\...) and this project (D:\...) are
# on different drive letters - its relative-path resolution can't handle
# cross-drive roots. Disabling incremental compilation avoids that broken
# code path; it only costs a slightly slower rebuild, not correctness.
kotlin.incremental=false
